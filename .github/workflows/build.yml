name: Build Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install pyinstaller python-docx openpyxl pyexcel-ods3
    - run: pyinstaller --onefile --noconsole --name WordToExcel --hidden-import pyexcel_ods3 --hidden-import pyexcel_ods3.odsr --hidden-import pyexcel_ods3.odsw --hidden-import pyexcel_ods3.ods3r --hidden-import pyexcel_ods3.ods3w word_to_excel.py
    - uses: actions/upload-artifact@v4
      with:
        name: Windows-EXE
        path: dist/WordToExcel.exe
